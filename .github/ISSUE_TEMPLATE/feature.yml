# SPDX-License-Identifier: AGPL-3.0-or-later
name: Feature request
description: Something Postmodem should do, or a Przemo feature it's missing.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Check [PARITY.md](https://github.com/postmodem-bbs/postmodem/blob/main/docs/PARITY.md) and the [roadmap](https://github.com/orgs/postmodem-bbs/projects/2) first: it may already be planned.
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you or your board's members are trying to do, and what gets in the way.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What you'd like
      description: How it could work. Screenshots of how Przemo or another board does it are welcome.
  - type: dropdown
    id: przemo
    attributes:
      label: Did phpBB2 / Przemo have this?
      options:
        - "No, it's new"
        - Yes, in phpBB2
        - Yes, in Przemo's modifications
        - Not sure
