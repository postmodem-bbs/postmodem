# SPDX-License-Identifier: AGPL-3.0-or-later
# Every commit in a pull request must carry a Signed-off-by line (ADR 0010, CONTRIBUTING.md).
name: DCO

on:
  pull_request:

permissions:
  contents: read

jobs:
  dco:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - name: Check sign-offs
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          missing=0
          for c in $(git rev-list --no-merges "$BASE..$HEAD"); do
            author_email=$(git log -1 --format='%ae' "$c")
            if ! git log -1 --format='%B' "$c" | grep -qiE "^Signed-off-by: .+ <${author_email}>$"; then
              echo "::error::commit $(git log -1 --format='%h %s' "$c") has no Signed-off-by matching its author (${author_email})"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Fix with: git rebase --signoff $BASE && git push --force-with-lease"
            exit 1
          fi
          echo "All commits are signed off."
