# SPDX-License-Identifier: AGPL-3.0-or-later
# Every commit in a pull request must carry a Signed-off-by line (ADR 0010, CONTRIBUTING.md).
name: DCO

on:
  pull_request:

permissions:
  contents: read

jobs:
  dco:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - name: Check sign-offs
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        # The same check the commit-msg and pre-push hooks run (scripts/dco.mjs).
        run: node scripts/dco.mjs "$BASE..$HEAD"
