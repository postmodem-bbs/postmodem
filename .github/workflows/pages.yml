# SPDX-License-Identifier: AGPL-3.0-or-later
# Publishes the project website (site/ plus the brand assets in docs/brand/) to GitHub Pages.
name: Pages

on:
  push:
    branches: [main]
    paths: ["site/**", "docs/brand/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Assemble the site
        run: |
          mkdir -p _site/brand
          cp -r site/. _site/
          cp docs/brand/*.svg docs/brand/palette.css _site/brand/
          cp -r docs/brand/png _site/brand/png
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
