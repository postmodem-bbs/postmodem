# SPDX-License-Identifier: AGPL-3.0-or-later
# Build once, test that exact image, promote the tested digest (CONTAINERS.md §6).
# Each change runs the full pipeline once, in the merge queue:
# - pull request: checks, an amd64 image and a few e2e jobs, for quick feedback;
# - merge queue: checks, the multi-arch sha-<sha> image pushed to GHCR, every e2e job against it;
# - push to main: re-tag the digest the queue tested as :edge. The queue fast-forwards main to
#   the commit it tested, so nothing is built or tested again;
# - v* tag: the full pipeline once more, since the release image carries its version.
name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  # The merge queue (CONTRIBUTING.md, Branch rules) tests each group before it lands on main.
  merge_group:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/postmodem-bbs/postmodem
  # The merge queue and release tags push the image they test; pull requests (forks included)
  # never push.
  CAN_PUSH: ${{ (github.event_name == 'merge_group' || startsWith(github.ref, 'refs/tags/v')) && github.repository == 'postmodem-bbs/postmodem' }}

jobs:
  checks:
    name: Lint, typecheck, unit tests, licences
    if: github.ref != 'refs/heads/main' || github.event_name != 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read # the private Przemo fixture image
    services:
      # The database suite runs on SQLite and PGlite everywhere, and on this real server in CI.
      postgres:
        image: postgres:18
        env: { POSTGRES_USER: test, POSTGRES_PASSWORD: test, POSTGRES_DB: test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U test" --health-interval 3s --health-timeout 3s --health-retries 20
      # Counters and live updates on Valkey (the `scale` profile).
      valkey:
        image: valkey/valkey:8
        ports: ["6379:6379"]
        options: >-
          --health-cmd "valkey-cli ping" --health-interval 3s --health-timeout 3s --health-retries 20
      meilisearch:
        image: getmeili/meilisearch:v1.15
        ports: ["7700:7700"]
        env: { MEILI_MASTER_KEY: postmodem-ci-search-key }
    env:
      PM_TEST_MEILI_URL: meilisearch://localhost:7700
      PM_TEST_MEILI_KEY: postmodem-ci-search-key
      PM_TEST_PG_URL: postgres://test:test@localhost:5432/test
      PM_TEST_VALKEY_URL: valkey://localhost:6379
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version-file: .node-version, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      # The importer suite runs against the generated Przemo board (tools/fixtures). Its image
      # is private, so forks skip this step and the suite skips itself.
      - name: Start the Przemo fixture database
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          fixture="ghcr.io/postmodem-bbs/fixture-przemo:$(jq -r .version tools/fixtures/package.json)-small"
          docker run -d --name fixture -p 3306:3306 "$fixture"
          for _ in $(seq 1 60); do docker exec fixture mariadb-admin ping -uprzemo -pprzemo --silent && break; sleep 1; done
          mkdir -p var && docker cp fixture:/fixture/manifest.json var/fixture-manifest.json
          echo "PM_TEST_MYSQL_URL=mysql://przemo:przemo@127.0.0.1:3306/przemo" >> "$GITHUB_ENV"
          echo "PM_TEST_FIXTURE_MANIFEST=$PWD/var/fixture-manifest.json" >> "$GITHUB_ENV"
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm check:spdx
      - run: pnpm check:licenses
      - name: CLI from source (README quickstart, #160)
        env: { POSTMODEM_DATA_DIR: "${{ runner.temp }}/cli-smoke" }
        run: |
          pnpm cli seed-demo
          pnpm cli doctor

  image:
    name: Build image
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write # keyless signing
      attestations: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
        if: env.CAN_PUSH == 'true'
      - uses: docker/setup-buildx-action@v4
      - name: Version
        id: v
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT";
          else echo "version=0.0.0-dev+${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"; fi
      # Pull requests and forks: single-arch image handed to the e2e jobs as an artifact.
      - name: Build (pull request)
        if: env.CAN_PUSH != 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          target: runtime
          platforms: linux/amd64
          build-args: |
            POSTMODEM_VERSION=${{ steps.v.outputs.version }}
            POSTMODEM_REVISION=${{ github.sha }}
          tags: postmodem:ci
          outputs: type=docker,dest=/tmp/postmodem-image.tar
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - if: env.CAN_PUSH != 'true'
        uses: actions/upload-artifact@v7
        with: { name: postmodem-image, path: /tmp/postmodem-image.tar, retention-days: 3 }
      # Merge queue and release tags: multi-arch image pushed once as sha-<sha>. The group's
      # head commit is the one main is fast-forwarded to, so the push to main only re-tags it.
      - if: env.CAN_PUSH == 'true'
        uses: docker/login-action@v4
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - name: Build and push (sha tag)
        id: push
        if: env.CAN_PUSH == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          target: runtime
          platforms: linux/amd64,linux/arm64
          build-args: |
            POSTMODEM_VERSION=${{ steps.v.outputs.version }}
            POSTMODEM_REVISION=${{ github.sha }}
          tags: ${{ env.IMAGE }}:sha-${{ github.sha }}
          push: true
          sbom: true
          provenance: mode=max
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Image size budget (< 150 MB compressed, DESIGN §5.1)
        if: env.CAN_PUSH == 'true'
        run: |
          size=$(docker buildx imagetools inspect "$IMAGE@${{ steps.push.outputs.digest }}" --raw \
            | jq '[.manifests[] | select(.platform.architecture=="amd64")][0].digest' -r \
            | xargs -I{} docker buildx imagetools inspect "$IMAGE@{}" --raw | jq '[.layers[].size] | add')
          echo "compressed amd64 size: $((size / 1048576)) MB"
          test "$size" -lt $((150 * 1048576))

  # The e2e matrix. Both shipped profiles (PACKAGES.md §5): the full suite on `essentials`, the
  # default, in solo and stack mode; once more on a `vanilla` board (no packages), where the
  # tests of a package's own behaviour skip themselves (e2e/helpers.ts, PROFILE).
  # browser: the full suite · url-browsers: the other URL styles (ADR 0012), if any ·
  # install: every browser the job uses · load-test: the k6 alarm, run once per CI run ·
  # pr: also runs on pull requests (the merge queue runs every entry).
  plan:
    name: E2E plan
    if: github.ref != 'refs/heads/main' || github.event_name != 'push'
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - id: matrix
        env:
          EVENT: ${{ github.event_name }}
        run: |
          jq -c --arg event "$EVENT" \
            '{include: [.[] | select($event != "pull_request" or .pr) | del(.pr)]}' <<'EOF' > matrix.json
          [
            { "name": "solo", "mode": "solo", "profile": "essentials", "browser": "chromium",
              "url-browsers": "chromium", "install": "chromium", "load-test": true, "pr": true },
            { "name": "solo", "mode": "solo", "profile": "essentials", "browser": "firefox",
              "url-browsers": "firefox", "install": "firefox" },
            { "name": "solo", "mode": "solo", "profile": "essentials", "browser": "webkit", "install": "webkit" },
            { "name": "stack", "mode": "stack", "profile": "essentials", "browser": "chromium",
              "url-browsers": "chromium,firefox", "install": "chromium firefox", "pr": true },
            { "name": "vanilla", "mode": "solo", "profile": "vanilla", "browser": "chromium", "install": "chromium", "pr": true },
            { "name": "vanilla", "mode": "solo", "profile": "vanilla", "browser": "firefox", "install": "firefox" },
            { "name": "vanilla", "mode": "solo", "profile": "vanilla", "browser": "webkit", "install": "webkit" },
            { "name": "classic-dark", "mode": "solo", "profile": "essentials", "browser": "chromium",
              "install": "chromium", "theme": "classic", "scheme": "dark" },
            { "name": "modern-light", "mode": "solo", "profile": "essentials", "browser": "chromium",
              "install": "chromium", "theme": "modern", "scheme": "light" },
            { "name": "modern-dark", "mode": "solo", "profile": "essentials", "browser": "chromium",
              "install": "chromium", "theme": "modern", "scheme": "dark" },
            { "name": "terminal-light", "mode": "solo", "profile": "essentials", "browser": "chromium",
              "install": "chromium", "theme": "terminal", "scheme": "light" },
            { "name": "terminal-dark", "mode": "solo", "profile": "essentials", "browser": "chromium",
              "install": "chromium", "theme": "terminal", "scheme": "dark" }
          ]
          EOF
          echo "matrix=$(cat matrix.json)" >> "$GITHUB_OUTPUT"
          jq -r '.include[] | "\(.name), \(.browser)"' matrix.json

  # One runner per board and browser, each with a board of its own. The `E2E` job below sums
  # them up and is the required check, so this matrix can change without a ruleset edit.
  e2e:
    name: E2E + accessibility (${{ matrix.name }}, ${{ matrix.browser }})
    env:
      # Only for the throwaway CI board; the e2e admin tests sign in with it.
      PM_ADMIN_PASSWORD: ci-admin-passphrase-not-secret
    needs: [plan, image]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read # pull the sha-tagged image built by the previous job
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version-file: .node-version, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Playwright version
        id: pw
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      # Browser builds are cached per Playwright version; the system libraries come from apt each run.
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}-${{ matrix.install }}
      - run: pnpm exec playwright install --with-deps ${{ matrix.install }}
      - name: Get the image under test
        run: |
          if [ "$CAN_PUSH" = "true" ]; then
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            docker pull "$IMAGE@${{ needs.image.outputs.digest }}"
            docker tag "$IMAGE@${{ needs.image.outputs.digest }}" postmodem:ci
          fi
      - if: env.CAN_PUSH != 'true'
        uses: actions/download-artifact@v8
        with: { name: postmodem-image, path: /tmp }
      - if: env.CAN_PUSH != 'true'
        run: docker load -i /tmp/postmodem-image.tar
      - name: Start (solo)
        if: matrix.mode == 'solo'
        working-directory: deploy
        env:
          POSTMODEM_IMAGE: "postmodem:ci"
          POSTMODEM_HTTP_PORT: "8080"
          POSTMODEM_MAIL_URL: smtp://mailpit:1025
          # Every test browser registers from the same address.
          POSTMODEM_REGISTRATIONS_PER_IP_HOUR: "0"
          POSTMODEM_PROFILE: ${{ matrix.profile }}
        run: |
          docker compose -f compose.solo.yaml -f ci/mailpit.yaml up -d --wait
          # The e2e suite browses the demo board (index, forums, topics).
          docker compose -f compose.solo.yaml -f ci/mailpit.yaml exec -T postmodem /nodejs/bin/node /app/postmodem.js seed-demo
          # e2e/posting.spec.ts: no flood interval (two browsers post as the same demo user).
          docker compose -f compose.solo.yaml -f ci/mailpit.yaml exec -T postmodem /nodejs/bin/node /app/postmodem.js settings set core.posting.floodSeconds 0
          docker compose -f compose.solo.yaml -f ci/mailpit.yaml exec -T postmodem /nodejs/bin/node /app/postmodem.js settings set core.posting.perHour 0
          docker compose -f compose.solo.yaml -f ci/mailpit.yaml exec -T postmodem /nodejs/bin/node /app/postmodem.js settings set core.search.perMinute 0
          docker compose -f compose.solo.yaml -f ci/mailpit.yaml exec -T postmodem /nodejs/bin/node /app/postmodem.js settings set core.board.defaultTheme "${{ matrix.theme || 'classic' }}"
          printf '%s' "$PM_ADMIN_PASSWORD" | docker compose -f compose.solo.yaml -f ci/mailpit.yaml exec -T postmodem /nodejs/bin/node /app/postmodem.js user set-password Admin
      - name: Start (stack)
        if: matrix.mode == 'stack'
        working-directory: deploy
        run: |
          mkdir -p secrets
          openssl rand -base64 32 | tr -d '\n' > secrets/db_password
          openssl rand -base64 48 | tr -d '\n' > secrets/secret_key
          chmod 644 secrets/*
          cat > .env <<'EOF'
          POSTMODEM_IMAGE=postmodem:ci
          POSTMODEM_PUBLIC_URL=https://localhost
          POSTMODEM_DOMAIN=localhost
          POSTMODEM_MAIL_URL=smtp://mailpit:1025
          POSTMODEM_SEARCH_URL=meilisearch://search:7700
          MEILI_MASTER_KEY=postmodem-ci-search-key
          POSTMODEM_REGISTRATIONS_PER_IP_HOUR=0
          POSTMODEM_PROFILE=${{ matrix.profile }}
          EOF
          docker compose --profile search -f compose.yaml -f ci/mailpit.yaml up -d --wait web worker mailpit search
          docker compose up -d proxy
          for _ in $(seq 1 30); do curl -skf https://localhost/readyz && break; sleep 2; done
          docker compose exec -T web /nodejs/bin/node /app/postmodem.js seed-demo
          docker compose exec -T web /nodejs/bin/node /app/postmodem.js search rebuild
          docker compose exec -T web /nodejs/bin/node /app/postmodem.js settings set core.posting.floodSeconds 0
          docker compose exec -T web /nodejs/bin/node /app/postmodem.js settings set core.posting.perHour 0
          docker compose exec -T web /nodejs/bin/node /app/postmodem.js settings set core.search.perMinute 0
          printf '%s' "$PM_ADMIN_PASSWORD" | docker compose exec -T web /nodejs/bin/node /app/postmodem.js user set-password Admin
      - name: Round-trip a Postgres backup from the runtime image
        if: matrix.mode == 'stack'
        working-directory: deploy
        run: |
          docker compose exec -T web /nodejs/bin/node -e '
            const fs = require("node:fs");
            fs.mkdirSync("/data/uploads", { recursive: true });
            fs.writeFileSync("/data/uploads/backup-smoke.txt", "backup smoke test");
          '
          docker compose exec -T web /nodejs/bin/node /app/postmodem.js backup /data/backups/ci
          docker compose cp web:/data/backups/ci "$RUNNER_TEMP/postmodem-backup"
          backup="$RUNNER_TEMP/postmodem-backup"
          jq -e '.format == 1 and .dialect == "pg"' "$backup/manifest.json"
          test "$(cat "$backup/uploads/backup-smoke.txt")" = "backup smoke test"
          docker compose exec -T db createdb -U postmodem postmodem_restore
          docker compose exec -T db pg_restore -U postmodem -d postmodem_restore \
            --single-transaction --no-owner --no-acl < "$backup/postmodem.dump"
          before=$(docker compose exec -T db psql -U postmodem -d postmodem -Atc 'SELECT count(*) FROM posts')
          after=$(docker compose exec -T db psql -U postmodem -d postmodem_restore -Atc 'SELECT count(*) FROM posts')
          test "$before" -gt 0
          test "$before" = "$after"
      - name: Run Playwright
        env:
          PM_BASE_URL: ${{ matrix.mode == 'solo' && 'http://localhost:8080' || 'https://localhost' }}
          PW_BROWSERS: ${{ matrix.browser }}
          PM_IGNORE_HTTPS_ERRORS: ${{ matrix.mode == 'stack' && '1' || '0' }}
          PM_MAILPIT_URL: http://localhost:8025
          PM_PROFILE: ${{ matrix.profile }}
          PM_BOARD_THEME: ${{ matrix.theme || 'classic' }}
          PM_COLOR_SCHEME: ${{ matrix.scheme || 'light' }}
        run: |
          # Settings changed by the CLI are picked up by the running web process on its next refresh.
          for attempt in $(seq 1 30); do
            if curl -ksf "$PM_BASE_URL/" | grep -F "data-board-theme=\"$PM_BOARD_THEME\"" >/dev/null; then
              break
            fi
            if [ "$attempt" = 30 ]; then
              echo "Board did not load the expected theme: $PM_BOARD_THEME" >&2
              exit 1
            fi
            sleep 1
          done
          pnpm exec playwright test
      - name: Permalinks in the other URL styles (ADR 0012)
        if: matrix.url-browsers
        working-directory: deploy
        env:
          PM_BASE_URL: ${{ matrix.mode == 'solo' && 'http://localhost:8080' || 'https://localhost' }}
          PW_BROWSERS: ${{ matrix.url-browsers }}
          PM_IGNORE_HTTPS_ERRORS: ${{ matrix.mode == 'stack' && '1' || '0' }}
        # The setting changes from the CLI while the board runs; the spec waits for it to apply.
        run: |
          if [ "${{ matrix.mode }}" = solo ]; then
            pm() { docker compose -f compose.solo.yaml -f ci/mailpit.yaml exec -T postmodem /nodejs/bin/node /app/postmodem.js "$@"; }
          else
            pm() { docker compose exec -T web /nodejs/bin/node /app/postmodem.js "$@"; }
          fi
          for style in numbered slug; do
            pm settings set core.urls.style "$style"
            PM_URL_STYLE="$style" pnpm --dir .. exec playwright test e2e/permalinks.spec.ts e2e/board.spec.ts -g "permalinks|WCAG"
          done
          pm settings set core.urls.style classic
      - name: Load test (DESIGN §5.1 CI alarm, deep pages included)
        if: matrix.load-test
        working-directory: deploy
        run: |
          pm() { docker compose -f compose.solo.yaml -f ci/mailpit.yaml exec -T postmodem /nodejs/bin/node /app/postmodem.js "$@"; }
          # A 10,000-post topic in a forum of its own, so the last topic page is a deep one.
          out=$(pm seed-demo --long-topic 10000 | grep -m1 '^added topic')
          topic=$(echo "$out" | sed -E 's/^added topic ([0-9]+) .*/\1/')
          docker run --rm --network host -v "$PWD/../tools/loadtest:/scripts:ro" \
            -e BASE_URL=http://localhost:8080 -e P95_MS=400 -e DURATION=20s \
            -e FORUM=4 -e FORUM_TOPICS=33 -e TOPIC="$topic" -e TOPIC_POSTS=10000 \
            grafana/k6:1.3.0 run --quiet /scripts/smoke.js
      - name: Change the board theme in the admin panel
        if: matrix.name == 'solo' && matrix.browser == 'chromium'
        env:
          PM_BASE_URL: http://localhost:8080
          PM_TEST_THEME_SETTING: "1"
        run: pnpm exec playwright test e2e/themes.spec.ts --grep "admin changes the board default"
      - name: Container logs
        if: failure()
        working-directory: deploy
        run: docker compose logs --no-color || docker compose -f compose.solo.yaml -f ci/mailpit.yaml logs --no-color
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report-${{ matrix.name }}-${{ matrix.browser }}
          path: var/playwright-report
          retention-days: 7

  # The required check for the e2e matrix (.github/rulesets/main.json). It runs even when an
  # e2e job fails or the image job never ran, and passes only if every e2e job passed.
  e2e-gate:
    name: E2E
    needs: [plan, image, e2e]
    if: always() && (github.ref != 'refs/heads/main' || github.event_name != 'push')
    runs-on: ubuntu-latest
    steps:
      - name: Every e2e job passed
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          IMAGE_RESULT: ${{ needs.image.result }}
          E2E_RESULT: ${{ needs.e2e.result }}
        run: |
          echo "plan: $PLAN_RESULT, image: $IMAGE_RESULT, e2e: $E2E_RESULT"
          test "$PLAN_RESULT" = success && test "$IMAGE_RESULT" = success && test "$E2E_RESULT" = success

  # Main: the merge queue built, tested and pushed sha-<sha> for this exact commit, so this
  # only re-tags it. Release tags: the digest this run built and tested.
  publish:
    name: Promote tested image
    needs: [image, e2e]
    if: >-
      always() && github.event_name == 'push' && github.repository == 'postmodem-bbs/postmodem' &&
      (github.ref == 'refs/heads/main' || needs.e2e.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      packages: write
      id-token: write
    steps:
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: sigstore/cosign-installer@v4.1.3 # publishes no moving major tag; Dependabot bumps it
      - name: Re-tag the tested digest (no rebuild)
        env:
          DIGEST: ${{ needs.image.outputs.digest }}
        run: |
          tags=()
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            v="${GITHUB_REF#refs/tags/v}"
            tags+=("$IMAGE:$v" "$IMAGE:${v%.*}" "$IMAGE:${v%%.*}" "$IMAGE:latest")
          else
            if ! DIGEST=$(docker buildx imagetools inspect "$IMAGE:sha-$GITHUB_SHA" --format '{{ .Manifest.Digest }}'); then
              echo "::error::$IMAGE:sha-$GITHUB_SHA does not exist: only commits that passed the merge queue are promoted."
              exit 1
            fi
            tags+=("$IMAGE:edge")
          fi
          test -n "$DIGEST"
          for t in "${tags[@]}"; do docker buildx imagetools create --tag "$t" "$IMAGE@$DIGEST"; done
          cosign sign --yes "$IMAGE@$DIGEST"
