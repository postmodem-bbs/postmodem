# CI only: catch every e-mail in Mailpit so the e2e suite can open verification and reset
# links. Add with `-f ci/mailpit.yaml` and set POSTMODEM_MAIL_URL=smtp://mailpit:1025.
services:
  mailpit:
    image: axllent/mailpit:v1.27
    ports: ["8025:8025"]
