# Postmodem, solo mode: one container, SQLite and local files in a named volume.
#   docker compose -f compose.solo.yaml up -d
# Put a TLS-terminating proxy in front for anything public, or use compose.yaml.
name: postmodem-solo

services:
  postmodem:
    image: ${POSTMODEM_IMAGE:-ghcr.io/postmodem-bbs/postmodem:edge}
    ports: ["${POSTMODEM_HTTP_PORT:-8080}:8080"]
    environment:
      POSTMODEM_PUBLIC_URL: ${POSTMODEM_PUBLIC_URL:-http://localhost:8080}
    volumes: ["postmodem-data:/data"]
    read_only: true
    tmpfs: ["/tmp"]
    restart: unless-stopped

volumes:
  postmodem-data: {}
