# Postmodem, solo mode: one container, SQLite and local files in a named volume.
#   sh install.sh --solo     (or by hand: docker compose -f compose.solo.yaml up -d)
# Put a TLS-terminating proxy in front for anything public, or use compose.yaml.
name: postmodem-solo

services:
  postmodem:
    image: ${POSTMODEM_IMAGE:-ghcr.io/postmodem-bbs/postmodem:edge}
    ports: ["${POSTMODEM_HTTP_PORT:-8080}:8080"]
    environment:
      POSTMODEM_PUBLIC_URL: ${POSTMODEM_PUBLIC_URL:-http://localhost:8080}
      # Which packages are on until an admin picks them: vanilla, essentials or przemo.
      POSTMODEM_PROFILE: ${POSTMODEM_PROFILE:-essentials}
      POSTMODEM_TRUSTED_PROXIES: ${POSTMODEM_TRUSTED_PROXIES:-}
      POSTMODEM_PROXY_HOPS: ${POSTMODEM_PROXY_HOPS:-}
      # smtp://user:pass@host:587 to deliver mail; log:// only writes it to the log.
      POSTMODEM_MAIL_URL: ${POSTMODEM_MAIL_URL:-log://}
      POSTMODEM_MAIL_FROM: ${POSTMODEM_MAIL_FROM:-}
      POSTMODEM_REGISTRATIONS_PER_IP_HOUR: ${POSTMODEM_REGISTRATIONS_PER_IP_HOUR:-10}
      # 1: an empty board starts as the demo (postmodem demo). Never for a real board.
      POSTMODEM_DEMO: ${POSTMODEM_DEMO:-}
    volumes: ["postmodem-data:/data"]
    read_only: true
    tmpfs: ["/tmp"]
    restart: unless-stopped

volumes:
  postmodem-data: {}
